<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#195b4a">
  <title>선표 — 굿노트용 표 만들기</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23195b4a'/%3E%3Cpath d='M16 18h32M16 32h32M16 46h32M22 12v40M42 12v40' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#143128;--green:#195b4a;--mint:#ddf2e7;--paper:#fffef9}*{box-sizing:border-box}body{margin:0;min-width:320px;font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:#e7eeea}button,select,input{font:inherit}button{border:1px solid transparent;cursor:pointer;border-radius:9px;padding:.58rem .72rem;color:var(--ink);background:#fff;font-weight:700}button:hover{border-color:#8caa9e}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #83cbb0;outline-offset:2px}.topbar{min-height:72px;padding:12px clamp(16px,3vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px;color:#fff;background:var(--green)}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid #85c8ad;border-radius:9px;font-size:22px}.brand strong{font-size:1.1rem}.brand small{display:block;color:#c6e4d5;font-size:.75rem;margin-top:2px}.file-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.file-actions button{background:transparent;color:#fff;border-color:#75a895}.file-actions .accent{color:#10372c;border-color:#bde8d4;background:#c7f0dc}main{display:grid;grid-template-columns:278px minmax(0,1fr);min-height:calc(100vh - 72px)}aside{padding:22px 19px;background:#f8fbf9;border-right:1px solid #d6e0db;overflow:auto;max-height:calc(100vh - 72px)}h2{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:#56726a}.section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid #dce5e0}.tool-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool{text-align:left;display:flex;align-items:center;gap:8px;border:1px solid #d5e1db}.tool.active{border-color:var(--green);background:var(--mint);color:#103c30;box-shadow:inset 3px 0 var(--green)}.icon{width:16px;text-align:center;font-size:1rem}label{display:grid;gap:6px;font-size:.8rem;font-weight:700;color:#46645b;margin-top:10px}input[type="range"]{accent-color:var(--green);width:100%}select,input[type="number"]{width:100%;padding:.5rem .58rem;border:1px solid #c7d6cf;border-radius:8px;color:var(--ink);background:#fff}.inline{display:flex;align-items:center;gap:9px}.inline input[type="color"]{width:43px;height:33px;padding:2px;border:1px solid #c7d6cf;border-radius:7px;background:white}.inline input[type="checkbox"]{width:17px;height:17px;accent-color:var(--green)}.option-list{display:grid;gap:7px}.option-list label{display:flex;align-items:center;gap:7px;margin:0;font-size:.82rem}.option-list input{accent-color:var(--green)}.hint{margin:0;color:#657b73;font-size:.78rem;line-height:1.55}.work{overflow:hidden;display:flex;flex-direction:column}.status{min-height:52px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border-bottom:1px solid #dce5e0;font-size:.85rem}.status span:last-child{color:#638a7b;white-space:nowrap}.stage-wrap{flex:1;overflow:auto;padding:clamp(20px,4vw,52px);display:grid;place-items:start center;background-color:#e8eeeb;background-image:radial-gradient(#cbd7d1 1px,transparent 1px);background-size:20px 20px}.page{position:relative;flex:none;background:var(--paper);box-shadow:0 14px 35px #2443392e;touch-action:none}.page canvas{display:block;width:100%;height:100%;cursor:crosshair}.page[data-tool="text"] canvas{cursor:text}.page[data-tool="select"] canvas{cursor:default}.page[data-tool="eraser"] canvas{cursor:not-allowed}.footer-note{margin:4px 0 0;font-size:.72rem;color:#73867f}@media(max-width:760px){.topbar{align-items:flex-start}.file-actions button{padding:.5rem}.file-actions{max-width:180px}main{grid-template-columns:1fr}aside{max-height:none;border-right:0;border-bottom:1px solid #d6e0db;padding:15px}.section{display:none}.section:first-child{display:block;margin:0;padding:0;border:0}.tool-list{grid-template-columns:repeat(5,1fr)}.tool{justify-content:center;padding:.52rem}.tool .label{display:none}.status{padding:0 16px}.stage-wrap{padding:24px 16px;justify-content:start}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="brand-mark">⌗</div><div><strong>선표</strong><small>굿노트용 표 캔버스</small></div></div><div class="file-actions"><button id="undoBtn" title="실행 취소 (Ctrl+Z)">↶ 취소</button><button id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)">↷ 다시</button><button id="clearBtn">새 캔버스</button><button id="pngBtn" class="accent">PNG 저장</button><button id="pdfBtn" class="accent">PDF 저장</button></div></header>
  <main><aside id="settingsPanel" aria-label="편집 도구">
    <section class="section"><h2>도구</h2><div class="tool-list" role="toolbar" aria-label="그리기 도구"><button class="tool active" data-tool="line" title="선 그리기"><span class="icon">╱</span><span class="label">선</span></button><button class="tool" data-tool="pen" title="펜"><span class="icon">✎</span><span class="label">펜</span></button><button class="tool" data-tool="text" title="텍스트"><span class="icon">T</span><span class="label">텍스트</span></button><button class="tool" data-tool="select" title="텍스트 선택"><span class="icon">↖</span><span class="label">선택</span></button><button class="tool" data-tool="eraser" title="지우개"><span class="icon">⌫</span><span class="label">지우기</span></button><button class="tool" data-tool="pan" title="화면 이동"><span class="icon">✋</span><span class="label">화면 이동</span></button></div></section>
    <button id="mobileSettingsBtn" class="mobile-settings-btn" type="button" aria-expanded="false" aria-controls="settingsPanel">⚙ 설정 열기</button>
    <section class="section"><h2>펜슬 입력</h2><label class="inline"><input id="pencilOnly" type="checkbox"><span>펜슬로만 그리기</span></label><p class="hint" style="margin-top:9px">펜슬을 감지하면 자동으로 켜집니다. 켜진 동안 손가락 한 개는 이동·칸 선택, 두 개는 확대/축소에 사용합니다. 끄면 손가락으로도 그릴 수 있습니다.</p></section>
    <section class="section"><h2>선과 펜</h2><label>색상 <span class="inline"><input id="color" type="color" value="#15302a"><span id="colorHex">#15302A</span></span></label><label>스타일<select id="lineStyle"><option value="solid">실선</option><option value="dashed">파선</option><option value="dotted">점선</option></select></label><label>굵기 <span id="lineWidthLabel">2 px</span><input id="lineWidth" type="range" min="1" max="14" value="2"></label></section>
    <section class="section"><h2>정렬 보조</h2><label class="inline"><input id="alignAssist" type="checkbox" checked><span>수평·수직 자동 정렬</span></label><label>격자 간격<select id="gridSize"><option value="10">10 px — 세밀하게</option><option value="20" selected>20 px — 기본</option><option value="40">40 px — 넓게</option><option value="0">격자 끄기</option></select></label></section>
    <section class="section"><h2>텍스트</h2><label>글자 크기<input id="fontSize" type="number" min="10" max="72" value="20"></label><button id="deleteTextBtn" style="margin-top:10px;width:100%">선택 텍스트 삭제</button><p class="hint" style="margin-top:9px">텍스트 도구로 닫힌 사각형 칸을 누르면 그 자리에서 입력하고 정렬을 고를 수 있습니다. 글이 많아지면 행이 아래로 늘어납니다.</p></section>
    <section class="section"><h2>페이지</h2><label>크기<select id="pageSize"><option value="goodnotes-p">굿노트 세로</option><option value="goodnotes-l">굿노트 가로</option><option value="a4-p">A4 세로</option><option value="a4-l">A4 가로</option><option value="square">정사각형</option></select></label></section>
    <section class="section"><h2>내보내기</h2><div class="option-list"><label><input type="radio" name="content" value="all" checked> 선과 텍스트</label><label><input type="radio" name="content" value="lines"> 선만</label><label><input id="transparent" type="checkbox"> 투명 배경 PNG</label></div></section><p class="footer-note">작업 내용은 이 기기에 자동 저장됩니다.</p>
  </aside><button id="settingsScrim" class="settings-scrim" type="button" aria-label="설정 닫기"></button><section class="work"><div class="status"><span id="statusText">선을 드래그해서 표를 시작하세요.</span><span id="saveState">자동 저장 켜짐</span><div class="zoom-controls" role="group" aria-label="캔버스 확대"><button id="zoomOut" type="button" aria-label="축소">−</button><button id="zoomReset" type="button" aria-label="화면에 맞추기">맞춤</button><button id="zoomIn" type="button" aria-label="확대">＋</button></div></div><div class="stage-wrap" id="stage"><div class="page-frame" id="pageFrame"><div class="page" id="page" data-tool="line"><canvas id="board" aria-label="표 편집 캔버스"></canvas></div></div></div></section></main>
  <style>
    .cell-editor{position:absolute;z-index:3;min-width:72px;border:2px solid #168263;border-radius:5px;background:rgba(255,255,255,.96);box-shadow:0 6px 18px #173d3038;display:flex;flex-direction:column}
    .cell-editor-tools{position:absolute;left:-2px;bottom:calc(100% + 5px);display:flex;align-items:center;gap:5px;padding:5px;background:#195b4a;color:#fff;border-radius:8px;white-space:nowrap;box-shadow:0 5px 14px #173d3030}
    .cell-editor-tools label{display:flex;align-items:center;gap:5px;margin:0;color:#fff;font-size:.8rem}
    .cell-editor-tools select{width:82px;padding:.3rem;font-size:.8rem}
    .cell-editor-tools button{padding:.34rem .48rem;font-size:.8rem}
    .cell-editor textarea{width:100%;height:100%;min-height:36px;resize:none;border:0;outline:0;background:transparent;padding:8px;color:#102b23;font-family:inherit;line-height:1.35;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
    .page-frame{position:relative;flex:none}
    .page{transform-origin:top left}
    .stage-wrap.pencil-mode{touch-action:none}
    .page[data-tool="pan"] canvas{cursor:grab}
    .mobile-settings-btn,.settings-scrim{display:none}
    .zoom-controls{display:flex;align-items:center;gap:5px;flex:none}
    .zoom-controls button{min-width:38px;min-height:38px;padding:.25rem .45rem;border:1px solid #c7d6cf}
    #zoomReset{min-width:62px;font-size:.82rem}
    #statusText{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:760px){
      body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
      .topbar{flex:none;min-height:auto;flex-direction:column;align-items:stretch;gap:8px;padding:8px 12px}
      .brand{gap:8px}.brand-mark{width:30px;height:30px}.brand small{display:none}
      .file-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;max-width:none}
      .file-actions button{min-height:44px;padding:.35rem .2rem;font-size:.875rem;white-space:nowrap}
      main{display:flex;flex-direction:column;flex:1;min-height:0}
      aside{flex:none;padding:8px 12px 9px;overflow:visible}
      aside .section:first-child h2{display:none}
      .tool-list{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
      .tool{min-width:0;min-height:44px;padding:.35rem;justify-content:center}
      .tool .icon{font-size:1.15rem}
      .mobile-settings-btn{display:block;width:100%;min-height:44px;margin-top:7px;background:#e5f3ec;border:1px solid #c4ddce;font-size:.875rem}
      aside.settings-open{position:fixed;z-index:11;inset:0 auto 0 0;width:min(92vw,360px);max-height:100dvh;overflow:auto;padding:16px;box-shadow:8px 0 30px #09271e40}
      aside.settings-open .section{display:block}
      aside.settings-open .section:first-child{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #dce5e0}
      aside.settings-open .section:first-child h2{display:block}
      aside.settings-open .tool-list{grid-template-columns:repeat(3,minmax(0,1fr))}
      aside.settings-open .tool .label{display:inline}
      .settings-scrim.open{display:block;position:fixed;z-index:10;inset:0;width:100%;height:100%;border:0;border-radius:0;background:#071a1380}
      .work{flex:1;min-height:0}
      .status{flex:none;min-height:48px;padding:4px 10px;gap:8px;font-size:.875rem}
      #saveState{display:none}
      .zoom-controls button{min-width:44px;min-height:44px}
      #zoomReset{min-width:56px}
      .stage-wrap{display:block;min-height:0;padding:12px;overflow:auto;overscroll-behavior:contain}
      aside label,aside .hint,aside h2,aside .footer-note{font-size:.875rem}
      .cell-editor-tools button,.cell-editor-tools select{min-height:46px}
      .cell-editor-tools label{font-size:1rem}
    }
  </style>
  <script src="app.js" defer></script>
</body>
</html>
