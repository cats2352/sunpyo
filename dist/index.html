<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#195b4a">
  <title>선표 — 굿노트용 표 만들기</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23195b4a'/%3E%3Cpath d='M16 18h32M16 32h32M16 46h32M22 12v40M42 12v40' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#143128;--green:#195b4a;--mint:#ddf2e7;--paper:#fffef9}*{box-sizing:border-box}body{margin:0;min-width:320px;font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:#e7eeea}button,select,input{font:inherit}button{border:1px solid transparent;cursor:pointer;border-radius:9px;padding:.58rem .72rem;color:var(--ink);background:#fff;font-weight:700}button:hover{border-color:#8caa9e}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #83cbb0;outline-offset:2px}.topbar{min-height:72px;padding:12px clamp(16px,3vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px;color:#fff;background:var(--green)}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid #85c8ad;border-radius:9px;font-size:22px}.brand strong{font-size:1.1rem}.brand small{display:block;color:#c6e4d5;font-size:.75rem;margin-top:2px}.file-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.file-actions button{background:transparent;color:#fff;border-color:#75a895}.file-actions .accent{color:#10372c;border-color:#bde8d4;background:#c7f0dc}main{display:grid;grid-template-columns:278px minmax(0,1fr);min-height:calc(100vh - 72px)}aside{padding:22px 19px;background:#f8fbf9;border-right:1px solid #d6e0db;overflow:auto;max-height:calc(100vh - 72px)}h2{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:#56726a}.section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid #dce5e0}.tool-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool{text-align:left;display:flex;align-items:center;gap:8px;border:1px solid #d5e1db}.tool.active{border-color:var(--green);background:var(--mint);color:#103c30;box-shadow:inset 3px 0 var(--green)}.icon{width:16px;text-align:center;font-size:1rem}label{display:grid;gap:6px;font-size:.8rem;font-weight:700;color:#46645b;margin-top:10px}input[type="range"]{accent-color:var(--green);width:100%}select,input[type="number"]{width:100%;padding:.5rem .58rem;border:1px solid #c7d6cf;border-radius:8px;color:var(--ink);background:#fff}.inline{display:flex;align-items:center;gap:9px}.inline input[type="color"]{width:43px;height:33px;padding:2px;border:1px solid #c7d6cf;border-radius:7px;background:white}.inline input[type="checkbox"]{width:17px;height:17px;accent-color:var(--green)}.option-list{display:grid;gap:7px}.option-list label{display:flex;align-items:center;gap:7px;margin:0;font-size:.82rem}.option-list input{accent-color:var(--green)}.hint{margin:0;color:#657b73;font-size:.78rem;line-height:1.55}.work{overflow:hidden;display:flex;flex-direction:column}.status{min-height:52px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border-bottom:1px solid #dce5e0;font-size:.85rem}.status span:last-child{color:#638a7b;white-space:nowrap}.stage-wrap{flex:1;overflow:auto;padding:clamp(20px,4vw,52px);display:grid;place-items:start center;background-color:#e8eeeb;background-image:radial-gradient(#cbd7d1 1px,transparent 1px);background-size:20px 20px}.page{position:relative;flex:none;background:var(--paper);box-shadow:0 14px 35px #2443392e;touch-action:none}.page canvas{display:block;width:100%;height:100%;cursor:crosshair}.page[data-tool="text"] canvas{cursor:text}.page[data-tool="select"] canvas{cursor:default}.page[data-tool="eraser"] canvas{cursor:not-allowed}.footer-note{margin:4px 0 0;font-size:.72rem;color:#73867f}@media(max-width:760px){.topbar{align-items:flex-start}.file-actions button{padding:.5rem}.file-actions{max-width:180px}main{grid-template-columns:1fr}aside{max-height:none;border-right:0;border-bottom:1px solid #d6e0db;padding:15px}.section{display:none}.section:first-child{display:block;margin:0;padding:0;border:0}.tool-list{grid-template-columns:repeat(5,1fr)}.tool{justify-content:center;padding:.52rem}.tool .label{display:none}.status{padding:0 16px}.stage-wrap{padding:24px 16px;justify-content:start}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="brand-mark">⌗</div><div><strong>선표</strong><small>굿노트용 표 캔버스</small></div></div><div class="file-actions"><button id="undoBtn" title="실행 취소 (Ctrl+Z)">↶ 취소</button><button id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)">↷ 다시</button><button id="clearBtn">새 캔버스</button><button id="pngBtn" class="accent">PNG 저장</button><button id="pdfBtn" class="accent">PDF 저장</button></div></header>
  <main><aside aria-label="편집 도구">
    <section class="section"><h2>도구</h2><div class="tool-list" role="toolbar" aria-label="그리기 도구"><button class="tool active" data-tool="line"><span class="icon">╱</span><span class="label">선</span></button><button class="tool" data-tool="pen"><span class="icon">✎</span><span class="label">펜</span></button><button class="tool" data-tool="text"><span class="icon">T</span><span class="label">텍스트</span></button><button class="tool" data-tool="select"><span class="icon">↖</span><span class="label">이동</span></button><button class="tool" data-tool="eraser"><span class="icon">⌫</span><span class="label">지우기</span></button></div></section>
    <section class="section"><h2>선과 펜</h2><label>색상 <span class="inline"><input id="color" type="color" value="#15302a"><span id="colorHex">#15302A</span></span></label><label>스타일<select id="lineStyle"><option value="solid">실선</option><option value="dashed">파선</option><option value="dotted">점선</option></select></label><label>굵기 <span id="lineWidthLabel">2 px</span><input id="lineWidth" type="range" min="1" max="14" value="2"></label></section>
    <section class="section"><h2>정렬 보조</h2><label class="inline"><input id="alignAssist" type="checkbox" checked><span>수평·수직 자동 정렬</span></label><label>격자 간격<select id="gridSize"><option value="10">10 px — 세밀하게</option><option value="20" selected>20 px — 기본</option><option value="40">40 px — 넓게</option><option value="0">격자 끄기</option></select></label></section>
    <section class="section"><h2>텍스트</h2><label>글자 크기<input id="fontSize" type="number" min="10" max="72" value="20"></label><button id="deleteTextBtn" style="margin-top:10px;width:100%">선택 텍스트 삭제</button><p class="hint" style="margin-top:9px">텍스트 도구로 기존 글자를 누르면 수정합니다. 이동 도구에서는 드래그로 위치를 바꿀 수 있습니다.</p></section>
    <section class="section"><h2>페이지</h2><label>크기<select id="pageSize"><option value="goodnotes-p">굿노트 세로</option><option value="goodnotes-l">굿노트 가로</option><option value="a4-p">A4 세로</option><option value="a4-l">A4 가로</option><option value="square">정사각형</option></select></label></section>
    <section class="section"><h2>내보내기</h2><div class="option-list"><label><input type="radio" name="content" value="all" checked> 선과 텍스트</label><label><input type="radio" name="content" value="lines"> 선만</label><label><input id="transparent" type="checkbox"> 투명 배경 PNG</label></div></section><p class="footer-note">작업 내용은 이 기기에 자동 저장됩니다.</p>
  </aside><section class="work"><div class="status"><span id="statusText">선을 드래그해서 표를 시작하세요.</span><span id="saveState">자동 저장 켜짐</span></div><div class="stage-wrap"><div class="page" id="page" data-tool="line"><canvas id="board" aria-label="표 편집 캔버스"></canvas></div></div></section></main>
  <script>
  (()=>{const KEY='sunpyo-canvas-v2',SIZES={'goodnotes-p':[1200,1550],'goodnotes-l':[1550,1200],'a4-p':[1240,1754],'a4-l':[1754,1240],square:[1200,1200]},$=s=>document.querySelector(s),canvas=$('#board'),ctx=canvas.getContext('2d'),page=$('#page'),status=$('#statusText'),saveState=$('#saveState'),c={color:$('#color'),style:$('#lineStyle'),width:$('#lineWidth'),grid:$('#gridSize'),align:$('#alignAssist'),font:$('#fontSize'),size:$('#pageSize'),transparent:$('#transparent')};let state={lines:[],strokes:[],texts:[],page:'goodnotes-p'},history=[],future=[],tool='line',draft=null,draftStroke=null,selectedText=null,dragText=null;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.page)state=saved}catch(_){}const dims=()=>SIZES[state.page]||SIZES['goodnotes-p'],clone=x=>JSON.parse(JSON.stringify(x));function setup(){const[w,h]=dims();canvas.width=w;canvas.height=h;page.style.width=w+'px';page.style.height=h+'px';c.size.value=state.page;render()}function commit(){history.push(clone(state));if(history.length>80)history.shift();future=[];buttons()}function save(){localStorage.setItem(KEY,JSON.stringify(state));saveState.textContent='방금 저장됨';clearTimeout(save.t);save.t=setTimeout(()=>saveState.textContent='자동 저장 켜짐',1200)}function buttons(){$('#undoBtn').disabled=!history.length;$('#redoBtn').disabled=!future.length}function undo(){if(!history.length)return;future.push(clone(state));state=history.pop();selectedText=null;setup();save();buttons();status.textContent='마지막 작업을 되돌렸습니다.'}function redo(){if(!future.length)return;history.push(clone(state));state=future.pop();selectedText=null;setup();save();buttons();status.textContent='작업을 다시 적용했습니다.'}function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),y:Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))}}const snap=n=>{const g=+c.grid.value;return g?Math.round(n/g)*g:Math.round(n)};function aligned(a,p){let x=snap(p.x),y=snap(p.y);if(c.align.checked){const dx=x-a.x,dy=y-a.y;if(Math.abs(dy)<Math.abs(dx)*.18)y=a.y;else if(Math.abs(dx)<Math.abs(dy)*.18)x=a.x}return{x,y}}function dash(s,w){return s==='dashed'?[w*4,w*2.5]:s==='dotted'?[w,w*2.6]:[]}function grid(){const g=+c.grid.value;if(!g)return;ctx.save();ctx.strokeStyle='#e8eee9';ctx.lineWidth=1;for(let x=g;x<canvas.width;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=g;y<canvas.height;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}ctx.restore()}function line(l,ghost=false,x=ctx){x.save();x.strokeStyle=ghost?'#4d9c80':l.color;x.lineWidth=l.w;x.lineCap='round';x.setLineDash(dash(l.style,l.w));x.beginPath();x.moveTo(l.x1,l.y1);x.lineTo(l.x2,l.y2);x.stroke();x.restore()}function stroke(s,ghost=false,x=ctx){if(s.points.length<2)return;x.save();x.strokeStyle=ghost?'#4d9c80':s.color;x.lineWidth=s.w;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(s.points[0].x,s.points[0].y);s.points.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.stroke();x.restore()}function text(t,sel=false,x=ctx){x.save();x.font=`${t.size}px ui-sans-serif,system-ui,sans-serif`;x.textBaseline='top';const rows=t.text.split('\n'),h=t.size*1.35;if(sel){const w=Math.max(...rows.map(r=>x.measureText(r).width));x.fillStyle='#dff4e8';x.fillRect(t.x-5,t.y-4,w+10,h*rows.length+8)}x.fillStyle='#102b23';rows.forEach((r,i)=>x.fillText(r,t.x,t.y+i*h));x.restore()}function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fffef9';ctx.fillRect(0,0,canvas.width,canvas.height);grid();state.lines.forEach(l=>line(l));state.strokes.forEach(s=>stroke(s));state.texts.forEach(t=>text(t,t===selectedText));if(draft)line(draft,true);if(draftStroke)stroke(draftStroke,true)}function hitText(p){for(let i=state.texts.length-1;i>=0;i--){const t=state.texts[i];ctx.font=`${t.size}px ui-sans-serif,system-ui,sans-serif`;const rows=t.text.split('\n'),w=Math.max(...rows.map(s=>ctx.measureText(s).width)),h=rows.length*t.size*1.35;if(p.x>=t.x-9&&p.x<=t.x+w+9&&p.y>=t.y-9&&p.y<=t.y+h+9)return t}return null}function distance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,len=dx*dx+dy*dy||1,u=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/len));return Math.hypot(p.x-(a.x+u*dx),p.y-(a.y+u*dy))}function nearest(p){let found=null,d=16;state.lines.forEach(l=>{const q=distance(p,{x:l.x1,y:l.y1},{x:l.x2,y:l.y2});if(q<d){d=q;found={kind:'lines',item:l}}});state.strokes.forEach(s=>{for(let i=1;i<s.points.length;i++){const q=distance(p,s.points[i-1],s.points[i]);if(q<d){d=q;found={kind:'strokes',item:s}}}});return found}function edit(t,p){const value=window.prompt(t?'텍스트를 수정하세요. (내용을 비우면 삭제됩니다)':'넣을 텍스트를 입력하세요.',t?.text||'');if(value===null)return;commit();if(t){if(value.trim())t.text=value.trim();else state.texts=state.texts.filter(x=>x!==t)}else if(value.trim())state.texts.push({x:snap(p.x),y:snap(p.y),text:value.trim(),size:+c.font.value});save();render();status.textContent=t?'텍스트를 수정했습니다.':'텍스트를 추가했습니다.'}function output(){const o=document.createElement('canvas');o.width=canvas.width;o.height=canvas.height;const x=o.getContext('2d'),only=document.querySelector('input[name="content"]:checked').value==='lines';if(!c.transparent.checked){x.fillStyle='#fffef9';x.fillRect(0,0,o.width,o.height)}state.lines.forEach(l=>line(l,false,x));state.strokes.forEach(s=>stroke(s,false,x));if(!only)state.texts.forEach(t=>text(t,false,x));return o}function setTool(name){tool=name;page.dataset.tool=name;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===name));status.textContent={line:'선을 드래그해서 표를 만드세요.',pen:'펜으로 자유롭게 그리세요. 스타일러스도 지원합니다.',text:'원하는 칸을 눌러 텍스트를 넣거나 수정하세요.',select:'텍스트를 드래그해 위치를 옮기세요.',eraser:'지울 선 또는 펜 획을 누르세요.'}[name]}canvas.addEventListener('pointerdown',e=>{const p=point(e);canvas.setPointerCapture(e.pointerId);if(tool==='line'){const a={x:snap(p.x),y:snap(p.y)};draft={x1:a.x,y1:a.y,x2:a.x,y2:a.y,w:+c.width.value,color:c.color.value,style:c.style.value}}else if(tool==='pen'){draftStroke={points:[{x:p.x,y:p.y}],w:+c.width.value,color:c.color.value}}else if(tool==='text')edit(hitText(p),p);else if(tool==='eraser'){const n=nearest(p);if(n){commit();state[n.kind]=state[n.kind].filter(x=>x!==n.item);save();render();status.textContent='지웠습니다.'}}else{selectedText=hitText(p);if(selectedText){dragText={item:selectedText,dx:p.x-selectedText.x,dy:p.y-selectedText.y};render()}}});canvas.addEventListener('pointermove',e=>{const p=point(e);if(draft){const q=aligned({x:draft.x1,y:draft.y1},p);draft.x2=q.x;draft.y2=q.y;render()}if(draftStroke){draftStroke.points.push({x:p.x,y:p.y});render()}if(dragText){dragText.item.x=snap(p.x-dragText.dx);dragText.item.y=snap(p.y-dragText.dy);render()}});canvas.addEventListener('pointerup',()=>{if(draft){const d=draft;draft=null;if(d.x1!==d.x2||d.y1!==d.y2){commit();state.lines.push(d);save();status.textContent='선을 추가했습니다.'}render()}if(draftStroke){const s=draftStroke;draftStroke=null;if(s.points.length>1){commit();state.strokes.push(s);save();status.textContent='펜 획을 추가했습니다.'}render()}if(dragText){commit();save();dragText=null;render();status.textContent='텍스트 위치를 옮겼습니다.'}});canvas.addEventListener('dblclick',e=>{const p=point(e),t=hitText(p);if(t)edit(t,p)});document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));c.color.addEventListener('input',()=>$('#colorHex').textContent=c.color.value.toUpperCase());c.width.addEventListener('input',()=>$('#lineWidthLabel').textContent=c.width.value+' px');c.grid.addEventListener('change',render);c.size.addEventListener('change',()=>{commit();state.page=c.size.value;setup();save();status.textContent='페이지 크기를 바꿨습니다.'});$('#undoBtn').addEventListener('click',undo);$('#redoBtn').addEventListener('click',redo);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}if((e.key==='Delete'||e.key==='Backspace')&&selectedText&&document.activeElement===document.body){commit();state.texts=state.texts.filter(t=>t!==selectedText);selectedText=null;save();render()}});$('#deleteTextBtn').addEventListener('click',()=>{if(!selectedText){status.textContent='이동 도구로 삭제할 텍스트를 먼저 선택하세요.';return}commit();state.texts=state.texts.filter(t=>t!==selectedText);selectedText=null;save();render();status.textContent='텍스트를 삭제했습니다.'});$('#clearBtn').addEventListener('click',()=>{if((state.lines.length||state.strokes.length||state.texts.length)&&confirm('캔버스의 선, 펜 획, 텍스트를 모두 지울까요?')){commit();state.lines=[];state.strokes=[];state.texts=[];selectedText=null;save();render();status.textContent='새 캔버스가 준비되었습니다.'}});$('#pngBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=output().toDataURL('image/png');a.download=c.transparent.checked?'sunpyo-transparent.png':'sunpyo-table.png';a.click();status.textContent='PNG 파일을 저장했습니다.'});$('#pdfBtn').addEventListener('click',()=>{const img=output().toDataURL('image/png'),[w,h]=dims(),win=window.open('','_blank');if(!win){alert('PDF 저장을 위해 팝업을 허용해 주세요.');return}win.document.write(`<!doctype html><title>선표 PDF</title><style>@page{size:${w>h?'landscape':'portrait'};margin:8mm}body{margin:0}img{width:100%;height:auto}</style><img src="${img}" onload="print()">`);win.document.close();status.textContent='인쇄 창에서 “PDF로 저장”을 선택하세요.'});setup();buttons()})();
  </script>
</body>
</html>
